plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
	// QueryDSL 플러그인을 직접 적용하는 방식 대신, 설정을 통해 의존성만 관리합니다.
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

// -------------------------------------------------------------
// QueryDSL 공식 라이브러리 설정 시작
// -------------------------------------------------------------
// 1. QueryDSL 버전 정의 (5.0.0이 가장 안정적인 최신 버전입니다.)
ext {
	queryDslVersion = "5.0.0"
}

dependencies {
	// Spring Boot Starter (기존 내용)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Lombok 설정 (기존 내용)
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'

	// 2. QueryDSL 라이브러리 추가
	// runtime 시 필요한 JPA 의존성
	implementation "com.querydsl:querydsl-jpa:${queryDslVersion}:jakarta"

	// 컴파일 시 Q-Class 생성을 위한 APT 의존성
	annotationProcessor "com.querydsl:querydsl-apt:${queryDslVersion}:jakarta"

	// JPA 및 Annotation API 의존성은 Spring Boot Starter에 대부분 포함되지만,
	// APT 의존성 명시를 위해 다시 추가합니다.
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"

	// Test 설정 (기존 내용)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.13'

	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'
}

// -------------------------------------------------------------
// 3. QueryDSL 관련 빌드 및 파일 관리 설정 (경로 정의)
// -------------------------------------------------------------
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

// QueryDSL Q-Class 생성을 위한 태스크 정의
tasks.withType(JavaCompile).configureEach {
	options.generatedSourceOutputDirectory.set(querydslDir)
}

// 소스 세트에 생성 경로 추가
sourceSets {
	main.java.srcDirs += [ querydslDir ]
}

// Clean 태스크에 생성 폴더 삭제 로직 추가
clean {
	delete file(querydslDir)
}